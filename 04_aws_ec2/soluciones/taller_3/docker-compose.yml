
services:
  api:
    build: .
    container_name: api
    environment:
      EC2_HOSTNAME: ${EC2_HOSTNAME}
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api


